<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Therapist Fit Quiz - Patient Education Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --linen: #F5F0E8;
    --cream: #FBF8F3;
    --moss: #2C3325;
    --charcoal: #2A2318;
    --warm-gray: #7A7268;
    --terracotta: #B85C38;
    --dusty-rose: #D4917A;
    --sage: #6B8F71;
    --pale-sage: #C8DCC9;
    --tan: #D8D0C4;
    --moss-light: #3a4530;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    color: var(--charcoal);
    background: var(--linen);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  img { max-width: 100%; height: auto; display: block; }

  /* ── HEADER ─────────────────────────────────── */
  header {
    background: var(--moss);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(251,248,243,.1);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 48px;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--pale-sage);
    border-bottom: 1px solid rgba(251,248,243,.1);
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--pale-sage);
  }

  .status-dot {
    width: 7px; height: 7px;
    background: var(--sage);
    border-radius: 50%;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  .header-phone a {
    color: var(--pale-sage);
    text-decoration: none;
    transition: color .2s;
  }
  .header-phone a:hover { color: var(--dusty-rose); }

  .header-main {
    text-align: center;
    padding: 22px 48px 16px;
  }

  .logo-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 28px;
    color: var(--cream);
    letter-spacing: .03em;
  }

  .logo-subtitle {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(251,248,243,.55);
    margin-top: 3px;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 36px;
    padding: 12px 48px;
    border-top: 1px solid rgba(251,248,243,.1);
  }

  nav a {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--pale-sage);
    text-decoration: none;
    transition: color .2s;
    position: relative;
  }

  nav a::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 1px;
    background: var(--terracotta);
    transform: scaleX(0);
    transition: transform .25s ease;
    transform-origin: left;
  }

  nav a:hover { color: var(--cream); }
  nav a:hover::after { transform: scaleX(1); }

  .nav-cta {
    color: var(--terracotta) !important;
    font-weight: 500 !important;
  }

  /* hamburger */
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
  }

  .hamburger span {
    display: block;
    width: 22px; height: 1.5px;
    background: var(--cream);
    transition: all .3s;
  }

  .mobile-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--cream);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    opacity: 0;
    transition: opacity .3s;
  }

  .mobile-overlay.open { display: flex; opacity: 1; }

  .mobile-overlay a {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 400;
    color: var(--charcoal);
    text-decoration: none;
    letter-spacing: .02em;
  }

  .close-overlay {
    position: absolute;
    top: 24px; right: 24px;
    font-size: 28px;
    cursor: pointer;
    color: var(--warm-gray);
    font-family: 'Jost', sans-serif;
  }

  /* ── SECTIONS ────────────────────────────────── */
  section { width: 100%; }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 48px;
  }

  /* ── HERO ────────────────────────────────────── */
  #hero {
    background: linear-gradient(160deg, var(--cream) 0%, var(--linen) 100%);
    padding: 92px 48px 84px;
    text-align: left;
    position: relative;
    overflow: hidden;
  }

  .hero-grid {
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.02fr .98fr;
    gap: 60px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .hero-photo { position: relative; }
  .hero-photo img {
    width: 100%;
    border-radius: 6px;
    box-shadow: 0 30px 64px rgba(42,35,24,.18);
    display: block;
  }
  .hero-photo::after {
    content: '';
    position: absolute;
    bottom: -16px; right: -16px;
    width: 96px; height: 96px;
    border: 2px solid var(--sage);
    border-radius: 6px;
    z-index: -1;
  }

  #hero::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 700px; height: 700px;
    background: radial-gradient(ellipse, rgba(107,143,113,.14) 0%, transparent 65%);
    pointer-events: none;
  }

  #hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: .6;
  }

  .hero-inner {
    position: relative;
    z-index: 1;
    max-width: 540px;
  }

  .hero-eyebrow {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp .8s .1s ease forwards;
  }

  .hero-h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(40px, 5vw, 64px);
    line-height: 1.14;
    color: var(--moss);
    margin-bottom: 26px;
    opacity: 0;
    animation: fadeUp .9s .25s ease forwards;
  }

  .hero-h1 em {
    font-style: italic;
    color: var(--terracotta);
  }

  .hero-sub {
    font-family: 'Jost', sans-serif;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.85;
    color: var(--warm-gray);
    max-width: 440px;
    margin: 0 0 36px;
    opacity: 0;
    animation: fadeUp .9s .4s ease forwards;
  }

  .hero-cta {
    opacity: 0;
    animation: fadeUp .9s .55s ease forwards;
  }

  .btn-primary {
    display: inline-block;
    background: var(--terracotta);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 2px;
    transition: background .25s, transform .2s;
  }

  .btn-primary:hover {
    background: #a34e2d;
    transform: translateY(-1px);
  }

  .hero-credentials {
    margin-top: 44px;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--warm-gray);
    opacity: 0;
    animation: fadeUp .9s .7s ease forwards;
  }

  .hero-credentials span { margin: 0 10px 0 0; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── IS THIS YOU ─────────────────────────────── */
  #is-this-you {
    background: var(--linen);
    padding: 100px 48px;
  }

  .section-label {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--warm-gray);
    margin-bottom: 14px;
  }

  .section-h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(34px, 4vw, 48px);
    line-height: 1.25;
    color: var(--charcoal);
    margin-bottom: 56px;
  }

  .section-h2 em { font-style: italic; color: var(--terracotta); }

  .cards-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .scenario-card {
    background: var(--cream);
    border: 1px solid var(--tan);
    border-radius: 8px;
    padding: 36px 32px;
    transition: border-color .25s, box-shadow .25s;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .6s ease, transform .6s ease, border-color .25s, box-shadow .25s;
  }

  .scenario-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .scenario-card:hover {
    border-color: var(--dusty-rose);
    box-shadow: 0 8px 32px rgba(44,51,37,.07);
  }

  .scenario-quote {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 18px;
    line-height: 1.65;
    color: var(--charcoal);
    margin-bottom: 22px;
  }

  .scenario-tag {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--warm-gray);
  }

  /* ── ABOUT ───────────────────────────────────── */
  #about {
    background: var(--cream);
    padding: 100px 48px;
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 72px;
    align-items: center;
  }

  .about-image-wrap {
    position: relative;
  }

  .about-photo {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    object-position: center 20%;
    border-radius: 4px;
    display: block;
  }

  .about-image-placeholder {
    width: 100%;
    aspect-ratio: 3/4;
    background: linear-gradient(145deg, var(--pale-sage) 0%, var(--tan) 100%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .about-image-placeholder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236B8F71' fill-opacity='0.12'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .about-image-label {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--sage);
    position: relative;
    z-index: 1;
  }

  .about-accent-block {
    position: absolute;
    bottom: -16px;
    right: -16px;
    width: 80px;
    height: 80px;
    border: 2px solid var(--sage);
    border-radius: 4px;
    z-index: -1;
  }

  .about-content .section-label { margin-bottom: 10px; }

  .about-h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(30px, 3.5vw, 44px);
    line-height: 1.25;
    color: var(--charcoal);
    margin-bottom: 28px;
  }

  .about-h2 em { font-style: italic; color: var(--terracotta); }

  .about-body {
    font-size: 15px;
    line-height: 1.9;
    color: var(--warm-gray);
    margin-bottom: 16px;
  }

  .about-credentials {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cred-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    font-weight: 400;
    color: var(--charcoal);
  }

  .cred-dot {
    width: 6px; height: 6px;
    background: var(--sage);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── SPECIALTIES ─────────────────────────────── */
  #specialties {
    background: var(--moss);
    padding: 100px 48px;
  }

  #specialties .section-label { color: var(--pale-sage); opacity: .7; }

  #specialties .section-h2 { color: var(--cream); }

  .specialties-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .specialty-card {
    padding: 28px 32px;
    border: 1px solid rgba(251,248,243,.1);
    border-radius: 8px;
    cursor: default;
    transition: background .25s, border-color .25s;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .6s ease, transform .6s ease, background .25s, border-color .25s;
  }

  .specialty-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .specialty-card:hover {
    background: rgba(251,248,243,.06);
    border-left: 3px solid var(--terracotta);
  }

  .specialty-tag {
    display: inline-block;
    background: rgba(107,143,113,.2);
    color: var(--pale-sage);
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
    margin-bottom: 12px;
  }

  .specialty-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 22px;
    color: var(--cream);
    margin-bottom: 8px;
  }

  .specialty-desc {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.75;
    color: rgba(251,248,243,.55);
  }

  /* ── WHAT TO EXPECT ──────────────────────────── */
  #expect {
    background: var(--linen);
    padding: 100px 48px;
  }

  .expect-photo {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    object-position: center 60%;
    border-radius: 6px;
    margin: 36px 0 12px;
    box-shadow: 0 20px 44px rgba(42,35,24,.12);
    display: block;
  }

  .steps-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin-top: 56px;
    position: relative;
  }

  .steps-row::before {
    content: '';
    position: absolute;
    top: 28px;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--tan), var(--tan), transparent);
  }

  .step {
    padding: 0 20px;
    text-align: center;
    position: relative;
  }

  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 56px;
    color: var(--tan);
    line-height: 1;
    margin-bottom: 16px;
  }

  .step-title {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--charcoal);
    margin-bottom: 12px;
  }

  .step-body {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--warm-gray);
  }

  /* ── FIT QUIZ ────────────────────────────────── */
  #quiz-section {
    background: var(--cream);
    padding: 100px 48px;
  }

  .quiz-wrap {
    max-width: 620px;
    margin: 0 auto;
  }

  .quiz-card {
    background: var(--linen);
    border: 1px solid var(--tan);
    border-radius: 8px;
    padding: 48px;
    margin-top: 48px;
  }

  .quiz-progress {
    display: flex;
    gap: 6px;
    margin-bottom: 36px;
  }

  .quiz-progress-bar {
    height: 2px;
    flex: 1;
    background: var(--tan);
    border-radius: 1px;
    transition: background .4s;
  }

  .quiz-progress-bar.done { background: var(--terracotta); }

  .quiz-q {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.35;
    color: var(--charcoal);
    margin-bottom: 28px;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .quiz-option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: var(--cream);
    border: 1px solid var(--tan);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 400;
    color: var(--charcoal);
    transition: border-color .2s, background .2s;
    text-align: left;
    width: 100%;
  }

  .quiz-option:hover {
    border-color: var(--dusty-rose);
    background: #fff9f7;
  }

  .quiz-option.selected {
    border-color: var(--terracotta);
    background: #fdf4f0;
  }

  .quiz-option-circle {
    width: 20px; height: 20px;
    border: 1.5px solid var(--tan);
    border-radius: 50%;
    flex-shrink: 0;
    transition: all .2s;
    display: flex; align-items: center; justify-content: center;
  }

  .quiz-option.selected .quiz-option-circle {
    background: var(--terracotta);
    border-color: var(--terracotta);
  }

  .quiz-option.selected .quiz-option-circle::after {
    content: '';
    width: 8px; height: 8px;
    background: white;
    border-radius: 50%;
  }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
  }

  .btn-text {
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--warm-gray);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: color .2s;
  }

  .btn-text:hover { color: var(--charcoal); }

  .btn-next {
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: var(--terracotta);
    color: var(--cream);
    border: none;
    cursor: pointer;
    padding: 14px 28px;
    border-radius: 2px;
    transition: background .2s;
  }

  .btn-next:hover { background: #a34e2d; }
  .btn-next:disabled { background: var(--tan); cursor: not-allowed; }

  .quiz-result {
    display: none;
  }

  .quiz-result.show { display: block; }

  .result-eyebrow {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 14px;
  }

  .result-h {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 30px;
    color: var(--charcoal);
    margin-bottom: 20px;
    line-height: 1.3;
  }

  .result-body {
    font-size: 15px;
    font-weight: 300;
    line-height: 1.9;
    color: var(--warm-gray);
    margin-bottom: 28px;
  }

  /* ── TESTIMONIALS ────────────────────────────── */
  #testimonials {
    background: var(--cream);
    padding: 100px 48px;
  }

  .testimonial-stack {
    margin-top: 56px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .testimonial-item {
    padding: 56px 0;
    border-top: 1px solid var(--tan);
    display: grid;
    grid-template-columns: 1fr 3fr;
    gap: 48px;
    align-items: start;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .7s ease, transform .7s ease;
  }

  .testimonial-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .testimonial-item:last-child { border-bottom: 1px solid var(--tan); }

  .testimonial-meta {
    padding-top: 8px;
  }

  .testimonial-name {
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--charcoal);
    margin-bottom: 4px;
  }

<body>
<section id="quiz-section">
  <div class="container">
    <div class="quiz-wrap">
      <div class="reveal">
        <div class="section-label">Therapist Fit Quiz</div>
        <h2 class="section-h2" style="margin-bottom:0;">Find out if we're<br>a <em>good fit.</em></h2>
        <p style="font-size:15px;font-weight:300;color:var(--warm-gray);line-height:1.8;margin-top:16px;">Four quick questions. A personalized answer at the end. No email required.</p>
      </div>
      <div class="quiz-card reveal" style="transition-delay:.15s">
        <!-- Quiz UI -->
        <div id="quiz-main">
          <div class="quiz-progress" id="quiz-progress">
            <div class="quiz-progress-bar" id="pb0"></div>
            <div class="quiz-progress-bar" id="pb1"></div>
            <div class="quiz-progress-bar" id="pb2"></div>
            <div class="quiz-progress-bar" id="pb3"></div>
          </div>
          <div class="quiz-q" id="quiz-question"></div>
          <div class="quiz-options" id="quiz-options"></div>
          <div class="quiz-nav">
            <button class="btn-text" id="quiz-back" onclick="quizBack()">← Back</button>
            <button class="btn-next" id="quiz-next" onclick="quizNext()" disabled>Continue</button>
          </div>
        </div>
        <!-- Result -->
        <div class="quiz-result" id="quiz-result">
          <div class="result-eyebrow">Your Personalized Note</div>
          <h3 class="result-h" id="result-title"></h3>
          <p class="result-body" id="result-body"></p>
          <a href="#booking" class="btn-primary">Schedule Your Free Call</a>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('.reveal, .scenario-card, .specialty-card, .testimonial-item').forEach(el => observer.observe(el));

  // ── QUIZ
  const questions = [
    {
      q: "What brings you in right now?",
      opts: ["Anxiety or constant worry", "Something painful that happened", "Relationship struggles", "Feeling lost or burnt out"]
    },
    {
      q: "Have you been in therapy before?",
      opts: ["No, this would be my first time", "Yes, and it helped", "Yes, but it didn't feel right", "Sort of - I've tried a few times"]
    },
    {
      q: "What matters most to you in a therapist?",
      opts: ["Someone direct who gets to the point", "Warmth and feeling truly heard", "Evidence-based, structured approach", "Space to go at my own pace"]
    },
    {
      q: "How are you hoping to feel 6 months from now?",
      opts: ["Lighter - less weighed down", "More confident in my relationships", "Like I understand myself better", "Like I actually have energy again"]
    }
  ];

  let current = 0;
  let answers = [];

  function renderQuestion() {
    const q = questions[current];
    document.getElementById('quiz-question').textContent = q.q;
    const optsEl = document.getElementById('quiz-options');
    optsEl.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option' + (answers[current] === i ? ' selected' : '');
      btn.innerHTML = `<span class="quiz-option-circle"></span>${opt}`;
      btn.onclick = () => selectOption(i);
      optsEl.appendChild(btn);
    });
    document.getElementById('quiz-back').style.visibility = current === 0 ? 'hidden' : 'visible';
    document.getElementById('quiz-next').disabled = answers[current] === undefined;
    document.getElementById('quiz-next').textContent = current === questions.length - 1 ? 'See My Results →' : 'Continue';
    for (let j = 0; j < 4; j++) {
      document.getElementById('pb'+j).classList.toggle('done', j <= current);
    }
  }

  function selectOption(i) {
    answers[current] = i;
    document.querySelectorAll('.quiz-option').forEach((btn, idx) => {
      btn.classList.toggle('selected', idx === i);
    });
    document.getElementById('quiz-next').disabled = false;
  }

  function quizNext() {
    if (current < questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function quizBack() {
    if (current > 0) { current--; renderQuestion(); }
  }

  const results = [
    {
      title: "You're carrying more than you let on.",
      body: "Based on what you shared, it sounds like you've been managing a lot - probably longer than you're comfortable admitting. The good news: you don't have to keep managing alone. The kind of support you're looking for is exactly what we focus on here. Therapy can be the space where you finally put some of that weight down."
    },
    {
      title: "You're ready - even if it doesn't feel that way.",
      body: "It takes a certain kind of courage to reach out, and it sounds like you've been thinking about this for a while. Whether therapy has been helpful before or not, what matters now is finding the right fit. I'd love to talk about what you're looking for and whether I'm that person."
    },
    {
      title: "You know yourself. Now let's go deeper.",
      body: "You have a sense of what you need - that clarity is actually a real asset in therapy. It tells me we can skip the surface-level stuff and get to what's actually going on faster. Based on what you've shared, I think we'd work well together."
    },
    {
      title: "You're looking for something real - not just symptom management.",
      body: "What you're describing goes beyond 'feeling better.' You want to understand why things are the way they are and build something more sustainable. That kind of deeper work is exactly what I specialize in. I'd love to have a conversation about what that could look like for you."
    }
  ];

  function showResult() {
    const score = (answers[0] || 0) + (answers[3] || 0);
    const r = results[Math.min(Math.floor(score / 2), results.length - 1)];
    document.getElementById('result-title').textContent = r.title;
    document.getElementById('result-body').textContent = r.body;
    document.getElementById('quiz-main').style.display = 'none';
    const res = document.getElementById('quiz-result');
    res.classList.add('show');
  }

  renderQuestion();
</script>
</body>
