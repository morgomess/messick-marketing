        fd.append('id', id);
        fd.append('data', JSON.stringify(this.buildSharePayload(i)));
        fetch(FEEDBACK_ENDPOINT, { method: 'POST', mode: 'no-cors', body: fd }).catch(() => {});
        const url = 'https://messickmarketing.com/reports/view.html?r=' + encodeURIComponent(id);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => this.showShare(url, true)).catch(() => this.showShare(url, false));
        } else this.showShare(url, false);
    },
    showShare(url, copied) {
        let ov = document.getElementById('share-overlay');
        if (!ov) { ov = document.createElement('div'); ov.id = 'share-overlay'; ov.className = 'confirm-overlay'; document.body.appendChild(ov); }
        ov.innerHTML = `<div class="confirm-dialog" style="max-width:500px; text-align:left;">
            <h3 style="margin-bottom:0.4rem;">Client share link</h3>
            <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.75rem;">${copied ? '&#10003; Copied to your clipboard.' : 'Copy the link below.'} It opens a standalone, unlisted report (with the feedback form built in) &mdash; no login, nothing else on the site links to it.</p>
            <input id="share-url" type="text" readonly value="${String(url).replace(/"/g,'&quot;')}" style="width:100%; font-size:0.78rem;" onclick="this.select()">
            <div style="display:flex; gap:8px; margin-top:1rem;">
                <button class="btn btn-primary" style="flex:1;" onclick="app.copyShare()">Copy link</button>
                <a class="btn btn-ghost" style="flex:1; text-align:center; text-decoration:none;" href="${String(url).replace(/"/g,'&quot;')}" target="_blank" rel="noopener">Open</a>
                <button class="btn btn-ghost" onclick="document.getElementById('share-overlay').style.display='none'">Close</button>
            </div>
        </div>`;
        ov.style.display = 'flex';
    },
    copyShare() { const el = document.getElementById('share-url'); if (!el) return; el.select(); try { navigator.clipboard.writeText(el.value); } catch (e) { try { document.execCommand('copy'); } catch (e2) {} } },
    // Which recommendation indices are selected for the client report (default: all)
    selectedRecSet(c) {
        const recs = this.normalizeRecs(c.findings);
        if (!Array.isArray(c.selectedRecs)) c.selectedRecs = recs.map((_, k) => k);
        return c.selectedRecs;
    },
    toggleRec(i, idx) {
        const c = this.clients[i];
        const sel = this.selectedRecSet(c);
        const pos = sel.indexOf(idx);
        if (pos >= 0) sel.splice(pos, 1); else sel.push(idx);
        this.persist();
        const card = document.getElementById(`rec-card-${idx}`);
        if (card) card.classList.toggle('on');
    },

    // Turn the strategist's rough note into a polished recommendation tile (AI), append it, auto-select it
    async addCustomRec(i) {
        const input = document.getElementById('custom-rec-input');
        const raw = ((input && input.value) || '').trim();
        if (!raw) return;
        const c = this.clients[i];
        if (!c || !c.findings) return;
        const btn = document.getElementById('custom-rec-btn');
        if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loader"></span>'; }

        let rec = null;
        if (this.apiKey) {
            try {
                const ctx = { period: this.periodLabel(c), clientContext: c.context || '', globals: c.global || {} };
                const prompt = `You are refining a strategist's rough note into ONE polished, client-facing recommendation for the social media audit of ${c.name}.
Account context: ${JSON.stringify(ctx).slice(0, 700)}
Rough note from the strategist: "${raw}"
Write it as Messick Marketing, first-person plural ("we", "our") - never "you should". Keep it specific and tied to this account where possible.
Output ONLY compact JSON on one line, nothing else: {"title":"short plain-language action","detail":"one sentence on what we'll do and why it matters","impact":"High|Medium|Low","target":"a measurable outcome, or empty string"}`;
                const resp = await fetch('https://calm-rice-eb6b.morgan-2bf.workers.dev', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey: this.apiKey, payload: { model: 'claude-haiku-4-5-20251001', max_tokens: 400, messages: [{ role: 'user', content: [{ type: 'text', text: prompt }] }] } })
                });
                const data = await resp.json();
                const txt = data && data.content && data.content[0] && data.content[0].text;
                const parsed = txt && this.parseFindingsJSON(txt);
                if (parsed && parsed.title) rec = { title: parsed.title, detail: parsed.detail || '', impact: parsed.impact || 'Medium', target: parsed.target || '', custom: true };
            } catch (e) { /* fall through to raw */ }
        }
        if (!rec) rec = { title: raw, detail: '', impact: 'Medium', target: '', custom: true }; // fallback: use the note as-is

        if (!Array.isArray(c.findings.recommendations)) c.findings.recommendations = [];
        c.findings.recommendations.push(rec);            // append at end -> stable index
        const newIdx = this.normalizeRecs(c.findings).length - 1;
        const sel = this.selectedRecSet(c);
        if (!sel.includes(newIdx)) sel.push(newIdx);     // auto-include in the client report
        this.persist();
        const body = document.getElementById('findings-body');
        if (body) body.innerHTML = this.findingsHTML(c.findings, i);
    },

    findingsHTML(f, i) {
        if (!f) return '';
        const c = this.clients[i];
        const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const list = (arr) => (arr || []).map(x => `<li style="margin-bottom:6px;">${esc(x)}</li>`).join('');
        const twoCol = (title, arr, color) => (arr && arr.length) ? `<div style="flex:1; min-width:200px;"><div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:${color}; margin-bottom:6px;">${title}</div><ul style="margin:0; padding-left:1.1rem; font-size:0.85rem;">${list(arr)}</ul></div>` : '';
        const platNotes = (f.platformNotes || []).map(pn => `<div style="margin-bottom:8px; font-size:0.85rem;"><strong>${esc(pn.platform)}:</strong> ${esc(pn.note)}</div>`).join('');
        const recs = this.normalizeRecs(f);
        const sel = this.selectedRecSet(c);
        const recCards = recs.map((r, idx) => `<div class="rec-card ${sel.includes(idx) ? 'on' : ''}" id="rec-card-${idx}" onclick="app.toggleRec(${i}, ${idx})"><div class="rec-check">&#10003; In client report</div><div class="rec-off">Tap to include</div><div class="rec-title">${esc(r.title)}${this.impactBadge(r.impact)}${r.custom ? '<span style="font-size:0.54rem; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:var(--purple); background:var(--purple-bg); padding:1px 6px; border-radius:6px; margin-left:6px;">Yours</span>' : ''}</div>${r.detail ? `<div class="rec-detail">${esc(r.detail)}</div>` : ''}${r.target ? `<div style="font-size:0.7rem; color:var(--steel); margin-top:5px; font-weight:600;">&#127919; ${esc(r.target)}</div>` : ''}</div>`).join('');
        const addRow = `<div style="margin-top:12px; display:flex; gap:6px; align-items:stretch;">
            <input type="text" id="custom-rec-input" placeholder="Add your own recommendation (e.g. upsell Basic + Video for more Reels)" style="flex:1; margin:0; padding:0.55rem 0.75rem; font-size:0.82rem;" onkeydown="if(event.key==='Enter')app.addCustomRec(${i})">
            <button class="btn btn-ghost btn-sm no-print" id="custom-rec-btn" onclick="app.addCustomRec(${i})" style="white-space:nowrap;">+ AI polish &amp; add</button>
        </div>`;
        const srcNote = (c.findingsSource === 'computed')
            ? `<div style="font-size:0.72rem; color:var(--amber); background:var(--amber-bg); padding:7px 11px; border-radius:6px; margin-bottom:12px;">Data-driven analysis${c.findingsError ? ` &middot; AI unavailable: ${esc(c.findingsError)}` : ''} &mdash; still tailored to this account&rsquo;s numbers. <span style="color:var(--steel); font-weight:700; cursor:pointer; text-decoration:underline;" onclick="app.generateFindings(${i}, true)">Retry AI</span></div>`
            : '';
        return `
            ${srcNote}
            ${f.executiveSummary ? `<p style="font-size:0.95rem; line-height:1.6; margin-bottom:1rem;">${esc(f.executiveSummary)}</p>` : ''}
            ${(f.keyFindings && f.keyFindings.length) ? `<div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:6px;">Key Findings</div><ul style="margin:0 0 1rem; padding-left:1.1rem; font-size:0.88rem; line-height:1.5;">${list(f.keyFindings)}</ul>` : ''}
            ${platNotes ? `<div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:6px;">By Platform</div><div style="margin-bottom:1rem;">${platNotes}</div>` : ''}
            <div style="display:flex; gap:1.5rem; flex-wrap:wrap; margin-bottom:1rem;">
                ${twoCol('Wins', f.wins, 'var(--green)')}
                ${twoCol('Concerns', f.concerns, 'var(--red)')}
            </div>
            <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--primary); margin-bottom:2px;">Recommendations</div><p style="font-size:0.72rem; color:var(--text-muted); margin-bottom:8px;">Tap to choose which appear in the client report.</p>${recs.length ? `<div class="rec-grid">${recCards}</div>` : ''}${addRow}
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:1.25rem;">
                <button class="btn btn-primary btn-sm no-print" onclick="app.view('report', ${i})">&#128196; Build Client Report &rarr;</button>
                <button class="btn btn-ghost btn-sm no-print" onclick="app.generateFindings(${i}, true)">&#8635; Regenerate analysis</button>
            </div>`;
    },

    /* ══════════════════════════════════════ CLIENT REPORT (polished, client-facing) */
    renderClientReport(el, i) {
        const c = this.clients[i];
        if (!c) { this.view('dashboard'); return; }
        const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const g = c.global || {}, platforms = c.platforms || [], f = c.findings;

        if (!f) {
            el.innerHTML = `<div style="max-width:760px; margin:0 auto; text-align:center; padding:3rem 1rem;">
                <h2 style="margin-bottom:0.5rem;">Analysis needed first</h2>
                <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">Open the audit and let the AI generate its Findings &amp; Analysis, then come back to build the client report.</p>
                <button class="btn btn-primary" onclick="app.view('profile', ${i})">&larr; Go to audit</button></div>`;
            return;
        }

        const prev = this.prevAuditFor(i), pg = (prev && prev.global) || null;
        const heroTiles = [
            { lbl:'Followers', val:fmt(g.followers||0), d: pg ? this.momPct(g.followers||0, pg.followers||0) : null },
            { lbl:'Impressions &amp; Views', val:fmt(g.impressions||0), d: pg ? this.momPct(g.impressions||0, pg.impressions||0) : null },
            { lbl:'Interactions', val:fmt(g.totalInteractions||0), d: pg ? this.momPct(g.totalInteractions||0, pg.totalInteractions||0) : null },
            { lbl:'Posts', val:g.totalContent||0, d: pg ? this.momPct(g.totalContent||0, pg.totalContent||0) : null }
        ];
        const heroHTML = heroTiles.map(t => {
            const chip = (t.d != null && isFinite(t.d)) ? `<span class="cr-win-delta" style="color:${t.d>=0?'#8fe0b0':'#ffb3b3'}">${t.d>=0?'+':''}${t.d.toFixed(0)}%</span>` : '';
            return `<div class="cr-win"><div class="cr-win-val">${t.val}${chip}</div><div class="cr-win-lbl">${t.lbl}</div></div>`;
        }).join('');

        const wins = (f.wins || []);
        const winsHTML = wins.length ? wins.map(w => `<div class="cr-highlight"><span class="cr-hl-ico">&#11088;</span><span class="cr-hl-txt">${esc(w)}</span></div>`).join('') : '';

        const top = (c.topContent || []).slice().sort((a,b) => (b.impressions||0)-(a.impressions||0) || (b.totalEng||0)-(a.totalEng||0)).slice(0, 5);
        const hasImpr = top.some(t => (t.impressions||0) > 0);
        const topHTML = top.length ? `<div style="overflow-x:auto;"><table><thead><tr><th>Post</th><th>Platform</th>${hasImpr ? '<th>Views</th>' : ''}<th>Interactions</th></tr></thead><tbody>${top.map(t => `<tr><td style="font-weight:600; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(t.title)}</td><td>${esc(t.platform)}</td>${hasImpr ? `<td style="font-weight:700;">${fmt(t.impressions)}</td>` : ''}<td>${fmt(t.totalEng)}</td></tr>`).join('')}</tbody></table></div>` : '';

        const recs = this.normalizeRecs(f), sel = this.selectedRecSet(c);
        const chosen = recs.filter((_, idx) => sel.includes(idx));
        const recsHTML = chosen.length ? chosen.map((r, n) => `<div class="cr-rec"><div class="cr-rec-num">${n+1}</div><div><div class="cr-rec-title">${esc(r.title)}${this.impactBadge(r.impact)}</div>${r.detail ? `<div class="cr-rec-detail">${esc(r.detail)}</div>` : ''}${r.target ? `<div style="font-size:0.8rem; color:var(--steel); margin-top:3px; font-weight:600;">&#127919; Target: ${esc(r.target)}</div>` : ''}</div></div>`).join('') : '<p style="color:var(--text-muted); font-size:0.85rem;">No recommendations selected. Pick some in the audit&rsquo;s Findings section.</p>';

        const lead = f.clientSummary || f.executiveSummary || '';

        el.innerHTML = `
            <div style="max-width:760px; margin:0 auto;">
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:1rem;">
                    <button class="btn btn-ghost btn-sm no-print" onclick="app.view('profile', ${i})">&larr; Full analysis</button>
                    <button class="btn btn-ghost btn-sm no-print" onclick="app.shareLink(${i})">&#128279; Share link</button>
                    <button class="btn btn-primary btn-sm no-print" onclick="window.print()">&#x2193; Export PDF</button>
                </div>

                <div class="cr-hero">
                    <h1>${esc(c.name)}</h1>
                    <div class="cr-sub">Social Media Performance &middot; ${this.periodLabel(c)}</div>
                    ${c.channels ? `<div class="cr-sub" style="margin-top:1px;">${esc(c.channels)}</div>` : ''}
                    <div class="cr-wins">${heroHTML}</div>
                </div>

                ${lead ? `<div class="cr-section"><div class="cr-h">The Story This Period</div><p class="cr-lead">${esc(lead)}</p></div>` : ''}

                ${winsHTML ? `<div class="cr-section"><div class="cr-h">Wins Worth Celebrating</div>${winsHTML}</div>` : ''}

                ${topHTML ? `<div class="cr-section"><div class="cr-h">Content That Landed</div>${topHTML}</div>` : ''}

                <div class="cr-section"><div class="cr-h">What We Recommend Next</div>${recsHTML}</div>

                <div style="text-align:center; font-size:0.66rem; color:var(--text-muted); padding:1rem 0 0.25rem;">Posts = feed posts + reels/shorts (Stories excluded). Impressions include video views.</div>
                <div style="text-align:center; font-size:0.72rem; color:var(--text-muted); padding:0.25rem 0 2rem;">
                    <span style="font-family:'Dancing Script',cursive; font-size:1.05rem; color:var(--steel);">Messick Marketing</span> &nbsp;&middot;&nbsp; Prepared for ${esc(c.name)} &nbsp;&middot;&nbsp; ${this.periodLabel(c)}
                </div>
            </div>`;
    },

    showPlatformTab(auditIndex, platform, btn) {
        document.querySelectorAll('.platform-tab-btn').forEach(t => t.classList.remove('active'));
        if (btn) btn.classList.add('active'); else document.querySelector('.platform-tab-btn')?.classList.add('active');
        const detail = document.getElementById('platform-detail');
        const c = this.clients[auditIndex];
        if (!c || !c.perPlatform || !c.perPlatform[platform]) { detail.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">No data.</p>'; return; }

        const pData = c.perPlatform[platform], fields = PLATFORM_FIELDS[platform] || [];
        const audience = ['followers','followersGained','followersLost'];
        const reach = ['reach','impressions','videoViews','watchTime','avgDailyReach'];
        const interactions = ['likes','comments','shares','saves','bookmarks','pinClicks','clicks','dislikes'];
        const meta = ['postsPublished','reelsPublished','engRate','avgWatchTime'];

        const renderGroup = (title, keys) => {
            const items = keys.filter(k => fields.includes(k)).map(k => ({ k, v: pData[k]||0 }));
            if (items.length === 0) return '';
            return `<div class="section-label" style="margin-top:0.75rem;">${title}</div><div class="stat-grid" style="grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:8px; margin-bottom:0.75rem;">${items.map(i => `<div class="stat-tile" style="padding:0.75rem;"><div class="val" style="font-size:1.1rem;">${fmt(i.v)}</div><div class="lbl">${platLabel(platform, i.k)}</div></div>`).join('')}</div>`;
        };
        detail.innerHTML = renderGroup('Audience', audience) + renderGroup('Reach & Views', reach) + renderGroup('Interactions', interactions) + renderGroup('Activity & Rate', meta);
    },

    getStrategyHTML(type) {
        if (type === 'win') return `<p style="margin-bottom:0.5rem;"><strong>1.</strong> Pin your top-performing post to the profile grid.</p><p style="margin-bottom:0.5rem;"><strong>2.</strong> Rewrite the first line of your next 3 posts with a stronger hook.</p><p style="margin-bottom:0.5rem;"><strong>3.</strong> Respond to every comment within 60 minutes of posting.</p><p><strong>4.</strong> Add a clear CTA to your bio and latest post caption.</p>`;
        if (type === 'week') return `<p style="margin-bottom:0.5rem;"><strong>1.</strong> Publish 3 saveable carousels (educational, tip-based, or myth-busting).</p><p style="margin-bottom:0.5rem;"><strong>2.</strong> Run an engagement poll or "this or that" in Stories daily.</p><p style="margin-bottom:0.5rem;"><strong>3.</strong> Audit and swap underperforming hashtags. Replace broad tags with 5 niche-specific ones.</p><p><strong>4.</strong> Post one Reel using a trending audio with a niche-relevant hook.</p>`;
        if (type === 'month') return `<p style="margin-bottom:0.5rem;"><strong>Week 1:</strong> Content audit. Identify top 5 posts from the last 90 days. Reverse-engineer format, hook, topic. Build 8 new posts from that template.</p><p style="margin-bottom:0.5rem;"><strong>Week 2:</strong> Launch a themed content series. Consistency builds anticipation.</p><p style="margin-bottom:0.5rem;"><strong>Week 3:</strong> Community push. DM top 20 engagers. Run a UGC prompt or giveaway.</p><p><strong>Week 4:</strong> Analyze what moved. Double down on winning formats. Set benchmarks for next month.</p>`;
        return '';
    },

    showTab(type, btn) {
        document.querySelectorAll('.timeframe-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('strategy-content').innerHTML = this.getStrategyHTML(type);
    },

    skipToManual() {
        const name = document.getElementById('client-name').value || 'New Audit';
        const platforms = this.getSelectedPlatforms();
        if (platforms.length === 0) return alert('Select at least one platform.');
        this.tempData = { _name: name }; platforms.forEach(p => this.tempData[p] = {});
        this.currentPlatforms = platforms; this.view('confirm');
    },

    toggleSettings() {
        const m = document.getElementById('settings-modal');
        const h = m.style.display === 'none' || m.style.display === '';
        m.style.display = h ? 'flex' : 'none';
        if (h) document.getElementById('api-key-input').value = this.apiKey;
    },
    savePDF() {
        // Show all pitch/strategy content before printing
        const pitch = document.getElementById('pitch-box');
        if (pitch) pitch.style.display = 'block';
        const strat = document.getElementById('strategy-content');
        if (strat) {
            const allTabs = ['win','week','month'];
            const combined = allTabs.map(t => {
                const labels = { win:'Quick Wins', week:'1-Week Fix', month:'4-Week Plan' };
                return '<div style="margin-bottom:1rem;"><strong style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted);">' + labels[t] + '</strong>' + this.getStrategyHTML(t) + '</div>';
            }).join('');
            strat.innerHTML = combined;
        }
        window.print();
    },
    saveSettings() { this.apiKey = document.getElementById('api-key-input').value; localStorage.setItem('eb_ant_key', this.apiKey); this.toggleSettings(); }
};
app.init();
</script>
<footer style="text-align:center; padding:1.5rem 1rem; font-family:'Jost',sans-serif; font-size:0.72rem; color:var(--text-muted); border-top:1px solid var(--border); margin-top:2rem; background:var(--white);">
  <span style="font-family:'Dancing Script',cursive; font-size:1.1rem; color:var(--steel);">Messick Marketing</span> &nbsp;&middot;&nbsp; Internal Tool &nbsp;&middot;&nbsp; <a href="https://messickmarketing.com" style="color:var(--steel); text-decoration:none; font-weight:500;">messickmarketing.com</a>
</footer>
</body>
</html>
