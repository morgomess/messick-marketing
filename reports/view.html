<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Report | Messick Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#111111;--warm:#faf8f5;--gray:#f0eeeb;--gray-mid:#e2dfd9;
    --steel:#3a6b8a;--steel-lt:#5a9ab8;--steel-pale:#d4e8f2;
    --ink:#141414;--muted:#6b6560;--line:rgba(58,107,138,.14);
    --green:#2d7a4f;--amber:#b07d2a;--red:#b0492f;
    --fh:'Cormorant Garamond',Georgia,serif;--fb:'Jost',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--warm);color:var(--black);font-family:var(--fb);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--fh);line-height:1.1}
  .inner{max-width:840px;margin:0 auto}
  .eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--steel);margin-bottom:1.1rem}
  .eyebrow-lt{font-size:.68rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--steel-lt);margin-bottom:1.1rem}

  /* reveal motion */
  .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

  /* ── HERO / COVER ── */
  .hero{position:relative;overflow:hidden;background:var(--ink);color:var(--warm);padding:2.6rem 1.5rem 2.8rem}
  .hero::after{content:'';position:absolute;top:-40%;right:-14%;width:65%;height:180%;background:radial-gradient(circle,rgba(58,107,138,.32),transparent 66%);pointer-events:none}
  .hero .inner{position:relative;z-index:1}
  .hero-mast{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:1.8rem;margin-bottom:2rem;border-bottom:1px solid rgba(255,255,255,.13)}
  .hero-mast img{height:26px;width:auto}
  .hero-mast-r{text-align:right}
  .hero-mast-r .tag{font-size:.6rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel-lt)}
  .hero-mast-r .per{font-size:.66rem;letter-spacing:.1em;color:rgba(250,248,245,.6);margin-top:5px}
  .hero-name{font-size:clamp(2.4rem,6vw,3.9rem);font-weight:700;letter-spacing:-.01em;color:#fff;text-wrap:balance}
  .hero-chan{font-size:.68rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,248,245,.55);margin-top:.9rem}
  .mband{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.13);border-radius:3px;margin-top:2.4rem;overflow:hidden}
  .metric{background:var(--ink);padding:1.35rem 1.15rem 1.25rem}
  .metric-val{font-family:var(--fh);font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
  .metric-lbl{font-size:.57rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,248,245,.55);margin-top:.65rem}
  @media(max-width:640px){.mband{grid-template-columns:repeat(2,1fr)}}

  /* ── STORY + HIGHLIGHTS (deep steel band) ── */
  .story{background:linear-gradient(158deg,#1a3244 0%,#23485e 100%);color:#fff;padding:3.2rem 1.5rem}
  .story-lead{font-family:var(--fh);font-size:clamp(1.45rem,3vw,2.05rem);font-weight:400;line-height:1.48;color:#fff;text-wrap:balance}
  .wins{margin-top:2.2rem}
  .win{display:flex;gap:1rem;align-items:flex-start;padding:.9rem 0;border-top:1px solid rgba(255,255,255,.13)}
  .win-dot{width:6px;height:6px;border-radius:1px;background:var(--steel-lt);margin-top:.6rem;flex-shrink:0}
  .win-txt{font-size:.96rem;font-weight:300;line-height:1.55;color:rgba(255,255,255,.92)}

  /* ── LIGHT BLOCKS ── */
  .block{padding:3rem 1.5rem}
  .block-alt{background:var(--gray)}

  /* platform breakdown chart */
  .chart-note{font-size:.8rem;color:var(--muted);margin:-.5rem 0 1.4rem}
  .chart-row{padding:.95rem 0;border-bottom:1px solid var(--line)}
  .chart-row:last-child{border-bottom:none}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.55rem}
  .chart-plat{font-size:.96rem;font-weight:500;color:var(--black)}
  .chart-val{font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .chart-track{height:10px;background:var(--gray-mid);border-radius:2px;overflow:hidden}
  .chart-fill{height:100%;background:linear-gradient(90deg,var(--steel),var(--steel-lt));border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  @media(prefers-reduced-motion:reduce){.chart-fill{transition:none}}

  /* top content leaderboard */
  .tc-row{display:flex;align-items:center;gap:1.1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
  .tc-row:last-child{border-bottom:none}
  .tc-rank{flex-shrink:0;width:2.2rem;font-family:var(--fh);font-size:1.75rem;font-weight:500;color:var(--steel);line-height:1;font-variant-numeric:tabular-nums}
  .tc-main{flex:1;min-width:0}
  .tc-title{font-size:.96rem;font-weight:500;color:var(--black);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc-plat{font-size:.6rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .tc-num{flex-shrink:0;text-align:right;font-family:var(--fh);font-weight:700;font-size:1.5rem;color:var(--black);line-height:1;font-variant-numeric:tabular-nums}
  .tc-num span{display:block;font-family:var(--fb);font-size:.55rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}

  /* recommendations */
  .rec{display:flex;gap:1.2rem;padding:1.15rem 0;border-bottom:1px solid var(--line)}
  .rec:last-child{border-bottom:none}
  .rec-n{flex-shrink:0;width:1.9rem;font-family:var(--fh);font-size:1.6rem;font-weight:500;color:var(--steel);line-height:1.1;font-variant-numeric:tabular-nums}
  .rec-t{font-size:1rem;font-weight:500;color:var(--black);line-height:1.35}
  .rec-d{font-size:.89rem;font-weight:300;color:var(--muted);line-height:1.55;margin-top:.3rem}
  .rec-tgt{font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-top:.5rem}
  .imp{display:inline-block;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:2px;margin-left:8px;vertical-align:middle}
  .imp-high{color:var(--red);background:rgba(176,73,47,.1)}
  .imp-med{color:var(--amber);background:rgba(176,125,42,.12)}

  /* ── FEEDBACK (highlighted, mid-report) ── */
  .fb{background:var(--ink);padding:3.6rem 1.5rem;position:relative;overflow:hidden}
  .fb::after{content:'';position:absolute;bottom:-45%;left:-12%;width:60%;height:170%;background:radial-gradient(circle,rgba(58,107,138,.28),transparent 66%);pointer-events:none}
  .fb-in{position:relative;z-index:1;background:#fff;border-radius:6px;padding:2.5rem;max-width:680px;margin:0 auto;border-top:4px solid var(--steel);box-shadow:0 26px 64px rgba(0,0,0,.34)}
  .fb h2{font-family:var(--fh);font-size:1.9rem;font-weight:500;margin-bottom:.35rem}
  .fb-sub{font-size:.93rem;color:var(--muted);margin-bottom:1.5rem}
  .fb-rate{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.1rem}
  .fb-rate label{cursor:pointer;position:relative}
  .fb-rate input{position:absolute;opacity:0;pointer-events:none}
  .fb-rate span{display:inline-block;padding:.6rem 1.15rem;border:1px solid rgba(58,107,138,.32);border-radius:2px;font-size:.78rem;font-weight:500;letter-spacing:.04em;transition:all .15s;user-select:none}
  .fb-rate label:hover span{border-color:var(--steel-lt)}
  .fb-rate input:checked+span{background:var(--steel);border-color:var(--steel);color:var(--warm)}
  .fb-rate input:focus-visible+span{outline:2px solid var(--steel-lt);outline-offset:2px}
  .fb textarea{width:100%;padding:.85rem 1rem;border:1px solid rgba(58,107,138,.24);border-radius:3px;font-family:inherit;font-size:.95rem;font-weight:300;background:var(--warm);resize:vertical;margin-bottom:1.1rem;color:var(--black)}
  .fb textarea:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(90,154,184,.16)}
  .fb-btn{background:var(--black);color:var(--warm);border:none;border-radius:2px;padding:.85rem 2.1rem;font-family:inherit;font-weight:500;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s}
  .fb-btn:hover{background:#2a2a2a}
  .fb-btn:disabled{opacity:.6;cursor:default}
  .fb-ok{color:var(--green);font-weight:500;margin-top:.9rem}
  .fb-err{color:var(--red);font-weight:500;margin-top:.9rem}
  .fb-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden;opacity:0}

  /* footer */
  .rpt-foot{background:var(--black);color:rgba(250,248,245,.6);text-align:center;padding:2.4rem 1.5rem}
  .rpt-foot img{height:26px;width:auto;margin-bottom:1rem}
  .rpt-foot .fp{font-size:.72rem;letter-spacing:.1em;color:rgba(250,248,245,.72)}
  .rpt-foot .fn{font-size:.63rem;letter-spacing:.04em;color:rgba(250,248,245,.4);margin-top:.7rem;max-width:440px;margin-left:auto;margin-right:auto;line-height:1.6}

  .load-err{max-width:620px;margin:5rem auto;text-align:center;color:var(--muted);padding:0 1.5rem}
  .load-err h2{font-size:1.9rem;font-weight:500;margin-bottom:.5rem;color:var(--black)}

  @media print{
    body{background:#fff}
    .hero::after,.fb::after{display:none}
    .rv{opacity:1;transform:none}
    .fb,.rpt-foot .fn{display:none}
    .block,.story,.tc-row,.rec,.win,.chart-row{break-inside:avoid}
    .chart-fill{transition:none}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  }
</style>
</head>
<body>
<div id="report"></div>
<footer class="rpt-foot" id="brandfoot"></footer>

<script>
  var FEEDBACK_ENDPOINT = "https://script.google.com/macros/s/AKfycbwg1DsRvziOZC7X0f1YOwjejCLbCnmjOyZtz_Bpz9ytXQdrkkCqYJrngvBc5-AqzXR-/exec";
  var LOGO = "https://messickmarketing.com/logo.png";
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K'; return Math.round(n).toLocaleString(); }
  function impactBadge(imp){ var t=(imp||'').toLowerCase(); if(!t) return ''; var c=t==='high'?'imp-high':t==='medium'?'imp-med':''; return c?'<span class="imp '+c+'">'+esc(imp)+'</span>':''; }

  function decodePayload(){
    var h = location.hash ? location.hash.slice(1) : '';
    if(!h) return null;
    var slash = h.lastIndexOf('/');
    var enc = slash >= 0 ? h.slice(slash + 1) : h;
    try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(enc))))); }
    catch(e){ return null; }
  }

  function render(d){
    document.title = (d.name ? d.name + ' | ' : '') + 'Report | Messick Marketing';

    var metrics = (d.metrics||[]).map(function(m){
      return '<div class="metric"><div class="metric-val"><span class="cv" data-val="'+esc(m.val)+'">'+esc(m.val)+'</span></div><div class="metric-lbl">'+esc(m.lbl)+'</div></div>';
    }).join('');

    var wins = (d.wins||[]).map(function(w){ return '<div class="win"><span class="win-dot"></span><span class="win-txt">'+esc(w)+'</span></div>'; }).join('');

    // Platform breakdown chart (share of reach)
    var plats = (d.platforms||[]).filter(function(p){ return (p.impressions||0)>0; });
    var chartHTML='';
    if(plats.length){
      var totalR = plats.reduce(function(s,p){ return s+(p.impressions||0); },0)||1;
      var maxR = plats.reduce(function(m,p){ return Math.max(m,p.impressions||0); },1);
      chartHTML = plats.slice().sort(function(a,b){ return (b.impressions||0)-(a.impressions||0); }).map(function(p){
        var share = Math.round((p.impressions||0)/totalR*100);
        var w = Math.max(2, Math.round((p.impressions||0)/maxR*100));
        return '<div class="chart-row"><div class="chart-head"><span class="chart-plat">'+esc(p.platform)+'</span>'+
          '<span class="chart-val">'+fmt(p.impressions)+' &middot; '+share+'%</span></div>'+
          '<div class="chart-track"><div class="chart-fill" data-w="'+w+'" style="width:0"></div></div></div>';
      }).join('');
    }

    var top = d.top||[];
    var hasImpr = top.some(function(t){ return (t.impressions||0)>0; });
    var unit = hasImpr ? 'views' : 'interactions';
    var topHTML = top.map(function(t,i){
      var vf = hasImpr ? (t.impressionsFmt||t.impressions||0) : (t.totalEng||0);
      return '<div class="tc-row"><span class="tc-rank">'+(i+1)+'</span>'+
        '<div class="tc-main"><div class="tc-title">'+esc(t.title)+'</div><div class="tc-plat">'+esc(t.platform)+'</div></div>'+
        '<div class="tc-num">'+esc(vf)+'<span>'+unit+'</span></div></div>';
    }).join('');

    var recs = (d.recs||[]).map(function(r,i){
      return '<div class="rec"><div class="rec-n">'+(i+1)+'</div><div><div class="rec-t">'+esc(r.title)+impactBadge(r.impact)+'</div>'+
        (r.detail?'<div class="rec-d">'+esc(r.detail)+'</div>':'')+
        (r.target?'<div class="rec-tgt">Target &middot; '+esc(r.target)+'</div>':'')+'</div></div>';
    }).join('');

    var html = '<section class="hero"><div class="inner">'+
      '<div class="hero-mast rv"><img src="'+LOGO+'" alt="Messick Marketing"><div class="hero-mast-r"><div class="tag">Social Performance Report</div>'+(d.period?'<div class="per">'+esc(d.period)+'</div>':'')+'</div></div>'+
      '<h1 class="hero-name rv">'+esc(d.name||'Report')+'</h1>'+
      (d.channels?'<div class="hero-chan rv">'+esc(d.channels)+'</div>':'')+
      (metrics?'<div class="mband rv">'+metrics+'</div>':'')+
      '</div></section>';

    if(d.lead || wins){
      html += '<section class="story rv"><div class="inner">'+
        '<div class="eyebrow-lt">This Period</div>'+
        (d.lead?'<p class="story-lead">'+esc(d.lead)+'</p>':'')+
        (wins?'<div class="wins">'+wins+'</div>':'')+
        '</div></section>';
    }
    if(chartHTML){
      html += '<section class="block rv"><div class="inner"><p class="eyebrow">Platform Breakdown</p><p class="chart-note">Share of reach by platform this period.</p>'+chartHTML+'</div></section>';
    }
    if(topHTML){
      html += '<section class="block block-alt rv"><div class="inner"><p class="eyebrow">Top Content</p>'+topHTML+'</div></section>';
    }
    html += '<section class="fb">'+feedbackHTML(d)+'</section>';
    if(recs){
      html += '<section class="block rv"><div class="inner"><p class="eyebrow">Recommendations</p>'+recs+'</div></section>';
    }
    document.getElementById('report').innerHTML = html;

    document.getElementById('brandfoot').innerHTML =
      '<img src="'+LOGO+'" alt="Messick Marketing">'+
      '<div class="fp">Prepared for '+esc(d.name||'')+(d.period?' &middot; '+esc(d.period):'')+'</div>'+
      '<div class="fn">Posts count feed posts plus reels and shorts. Stories are excluded. Impressions include video views.</div>';

    wireFeedback(d);
    animate();
  }

  function fillCharts(scope){
    (scope||document).querySelectorAll('.chart-fill').forEach(function(f){ f.style.width = f.getAttribute('data-w')+'%'; });
  }

  function animate(){
    var els = [].slice.call(document.querySelectorAll('.rv'));
    var hero = [].slice.call(document.querySelectorAll('.hero .rv'));
    hero.forEach(function(el,i){ el.style.transitionDelay = (i*0.09)+'s'; });
    requestAnimationFrame(function(){ hero.forEach(function(el){ el.classList.add('in'); }); countUp(); });
    var rest = els.filter(function(el){ return !el.closest('.hero'); });
    if(REDUCE || !('IntersectionObserver' in window)){ rest.forEach(function(el){ el.classList.add('in'); }); fillCharts(); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); fillCharts(e.target); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    rest.forEach(function(el){ io.observe(el); });
  }

  function countUp(){
    [].slice.call(document.querySelectorAll('.cv')).forEach(function(el){
      var raw = el.getAttribute('data-val') || el.textContent;
      var m = String(raw).match(/^([\d,]*\.?\d+)(.*)$/);
      if(REDUCE || !m){ el.textContent = raw; return; }
      var target = parseFloat(m[1].replace(/,/g,'')), suffix = m[2];
      var dec = (m[1].split('.')[1]||'').length;
      var start = null, dur = 950;
      function tick(ts){
        if(start===null) start = ts;
        var p = Math.min(1,(ts-start)/dur), e = 1-Math.pow(1-p,3), v = target*e;
        el.textContent = (dec ? v.toFixed(dec) : Math.round(v).toLocaleString()) + suffix;
        if(p<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  function feedbackHTML(d){
    return '<div class="fb-in rv"><p class="eyebrow">Your Input</p><h2>Tell us what you want more of</h2>'+
      '<p class="fb-sub">A quick note shapes what we build next quarter.</p>'+
      '<form id="mm-fb-form" novalidate>'+
        '<input type="hidden" name="client_slug" value="'+esc(d.slug||'')+'">'+
        '<input type="hidden" name="client_name" value="'+esc(d.name||'')+'">'+
        '<input type="hidden" name="page" value="">'+
        '<input type="text" name="company_url" class="fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">'+
        '<div class="fb-rate" role="radiogroup" aria-label="Overall rating">'+
          '<label><input type="radio" name="rating" value="More like this"><span>More like this</span></label>'+
          '<label><input type="radio" name="rating" value="About right"><span>About right</span></label>'+
          '<label><input type="radio" name="rating" value="Less of this"><span>Less of this</span></label>'+
        '</div>'+
        '<textarea name="message" rows="4" placeholder="Topics, formats, platforms. Tell us what you would love more of."></textarea>'+
        '<button type="submit" class="fb-btn">Send Feedback</button>'+
        '<p class="fb-ok" hidden>Thank you. We have your feedback and we will build it into next quarter.</p>'+
        '<p class="fb-err" hidden>That did not send. Please email us at morgan@messickmarketing.com.</p>'+
      '</form></div>';
  }

  function wireFeedback(){
    var form = document.getElementById('mm-fb-form'); if(!form) return;
    var pg = form.querySelector('[name=page]'); if(pg) pg.value = location.href;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(form.company_url && form.company_url.value) return;
      var btn=form.querySelector('.fb-btn'), ok=form.querySelector('.fb-ok'), err=form.querySelector('.fb-err');
      ok.hidden=true; err.hidden=true; btn.disabled=true; btn.textContent='Sending';
      fetch(FEEDBACK_ENDPOINT,{method:'POST',mode:'no-cors',body:new FormData(form)})
        .then(function(){ form.reset(); ok.hidden=false; btn.textContent='Sent'; })
        .catch(function(){ err.hidden=false; btn.disabled=false; btn.textContent='Send Feedback'; });
    });
  }

  function showMissing(){
    document.getElementById('report').innerHTML = '<div class="load-err"><h2>Report not found</h2><p>This link is missing its report, or it has not finished saving yet. Give it a moment and refresh, or ask Messick Marketing to resend it.</p></div>';
  }

  function fetchReport(id, attempt){
    attempt = attempt || 0;
    var cbName = '__rpt' + Date.now();
    var s = document.createElement('script');
    var done = false;
    var cleanup = function(){ try{document.body.removeChild(s)}catch(e){} try{delete window[cbName]}catch(e){} };
    window[cbName] = function(data){
      done = true; cleanup();
      if(!data || data.error){ if(attempt < 2){ setTimeout(function(){ fetchReport(id, attempt+1); }, 1600); } else showMissing(); return; }
      render(data);
    };
    s.onerror = function(){ if(!done){ cleanup(); if(attempt < 2){ setTimeout(function(){ fetchReport(id, attempt+1); }, 1600); } else showMissing(); } };
    s.src = FEEDBACK_ENDPOINT + '?report=' + encodeURIComponent(id) + '&callback=' + cbName + '&_=' + Date.now();
    document.body.appendChild(s);
    setTimeout(function(){ if(!done){ s.onerror(); } }, 10000);
  }

  var params = new URLSearchParams(location.search);
  var rid = params.get('r');
  if(rid){ fetchReport(rid); }
  else {
    var data = decodePayload();
    if(data) render(data); else showMissing();
    window.addEventListener('hashchange', function(){ var d=decodePayload(); if(d) render(d); });
  }
</script>
</body>
</html>
