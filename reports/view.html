<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Report | Messick Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--black:#111111;--warm:#faf8f5;--steel:#3a6b8a;--steel-lt:#5a9ab8;--muted:#5a6b74;--line:rgba(58,107,138,.16);--green:#2d7a4f;--green-bg:#e9f3ec;--amber:#b07d2a;--amber-bg:#fdf3e0;--red:#b0492f;--red-bg:#f8ece7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--warm);color:var(--black);font-family:'Jost',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:2rem 1.5rem}
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.15}
  .cr-hero{background:linear-gradient(135deg,#1c2e3d,#3a6b8a);color:#fff;border-radius:16px;padding:2rem;margin-bottom:1.25rem}
  .cr-hero h1{color:#fff;font-size:2rem;font-weight:700}
  .cr-sub{color:rgba(255,255,255,.72);font-size:.85rem;margin-top:4px}
  .cr-wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:1.5rem}
  .cr-win{background:rgba(255,255,255,.12);border-radius:12px;padding:1rem 1.1rem}
  .cr-win-val{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:700;line-height:1}
  .cr-win-delta{font-size:.72rem;font-weight:700;margin-left:4px}
  .cr-win-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;opacity:.82;margin-top:5px}
  .cr-section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem}
  .cr-h{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;margin-bottom:.85rem}
  .cr-lead{font-size:1rem;line-height:1.65}
  .cr-highlight{display:flex;gap:12px;align-items:flex-start;padding:.85rem 1rem;background:var(--green-bg);border-left:4px solid var(--green);border-radius:8px;margin-bottom:8px}
  .cr-hl-ico{font-size:1.15rem;line-height:1.3}
  .cr-hl-txt{font-size:.92rem;line-height:1.5;font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{text-align:left;font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.6rem .7rem;border-bottom:1px solid var(--line)}
  td{padding:.6rem .7rem;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .cr-rec{display:flex;gap:12px;padding:.9rem 0;border-bottom:1px solid var(--line)}
  .cr-rec:last-child{border-bottom:none}
  .cr-rec-num{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--steel);color:var(--warm);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.8rem}
  .cr-rec-title{font-weight:700;font-size:.95rem}
  .cr-rec-detail{font-size:.86rem;color:var(--muted);line-height:1.5;margin-top:2px}
  .cr-rec-target{font-size:.8rem;color:var(--steel);margin-top:3px;font-weight:600}
  .imp{display:inline-block;font-size:.54rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .imp-high{color:var(--red);background:var(--red-bg)}
  .imp-med{color:var(--amber);background:var(--amber-bg)}
  .foot-note{text-align:center;font-size:.66rem;color:var(--muted);padding:1rem 0 .25rem}
  .foot-brand{text-align:center;font-size:.72rem;color:var(--muted);padding:.25rem 0 1rem}
  .foot-brand span{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--steel);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  /* feedback */
  .mm-fb{max-width:660px;margin:1rem auto 0;padding:2rem;background:#fff;border:1px solid var(--line);border-radius:16px}
  .mm-fb h2{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;margin:0 0 .25rem}
  .mm-fb-sub{color:var(--steel);font-weight:500;margin:0 0 1.25rem}
  .mm-fb-rating{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
  .mm-fb-rating label{cursor:pointer;position:relative}
  .mm-fb-rating input{position:absolute;opacity:0;pointer-events:none}
  .mm-fb-rating span{display:inline-block;padding:.55rem 1rem;border:1.5px solid rgba(58,107,138,.35);border-radius:24px;font-size:.9rem;transition:all .15s;user-select:none}
  .mm-fb-rating label:hover span{border-color:var(--steel-lt)}
  .mm-fb-rating input:checked+span{background:var(--steel);border-color:var(--steel);color:var(--warm)}
  .mm-fb textarea{width:100%;padding:.8rem 1rem;border:1.5px solid rgba(58,107,138,.25);border-radius:10px;font-family:inherit;font-size:.95rem;background:var(--warm);resize:vertical;margin-bottom:1rem;color:var(--black)}
  .mm-fb textarea:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(90,154,184,.18)}
  .mm-fb-btn{background:var(--steel);color:var(--warm);border:none;border-radius:24px;padding:.7rem 1.8rem;font-family:inherit;font-weight:600;font-size:.9rem;letter-spacing:.03em;cursor:pointer;transition:background .2s}
  .mm-fb-btn:hover{background:var(--steel-lt)}
  .mm-fb-btn:disabled{opacity:.6;cursor:default}
  .mm-fb-ok{color:var(--green);font-weight:600;margin:.9rem 0 0}
  .mm-fb-err{color:#b94040;font-weight:600;margin:.9rem 0 0}
  .mm-fb-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden;opacity:0}
  .load-err{max-width:620px;margin:4rem auto;text-align:center;color:var(--muted)}
  @media(max-width:640px){.cr-hero h1{font-size:1.6rem}}
</style>
</head>
<body>
<div class="wrap" id="report"></div>

<script>
  var FEEDBACK_ENDPOINT = "https://script.google.com/macros/s/AKfycbwg1DsRvziOZC7X0f1YOwjejCLbCnmjOyZtz_Bpz9ytXQdrkkCqYJrngvBc5-AqzXR-/exec";

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function impactBadge(imp){ var t=(imp||'').toLowerCase(); if(!t) return ''; var c=t==='high'?'imp-high':t==='medium'?'imp-med':''; return c?'<span class="imp '+c+'">'+esc(imp)+'</span>':''; }

  function decodePayload(){
    var h = location.hash ? location.hash.slice(1) : '';
    if(!h) return null;
    // URL may be #<readable-slug>/<encoded-payload> ; the payload is after the last "/"
    var slash = h.lastIndexOf('/');
    var enc = slash >= 0 ? h.slice(slash + 1) : h;
    try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(enc))))); }
    catch(e){ return null; }
  }

  function render(d){
    document.title = (d.name ? d.name + ' | ' : '') + 'Report | Messick Marketing';
    var heroTiles = (d.metrics||[]).map(function(m){
      var chip = (m.delta!=null && isFinite(m.delta)) ? '<span class="cr-win-delta" style="color:'+(m.delta>=0?'#8fe0b0':'#ffb3b3')+'">'+(m.delta>=0?'+':'')+Number(m.delta).toFixed(0)+'%</span>' : '';
      return '<div class="cr-win"><div class="cr-win-val">'+esc(m.val)+chip+'</div><div class="cr-win-lbl">'+esc(m.lbl)+'</div></div>';
    }).join('');

    var wins = (d.wins||[]).map(function(w){ return '<div class="cr-highlight"><span class="cr-hl-ico">&#11088;</span><span class="cr-hl-txt">'+esc(w)+'</span></div>'; }).join('');

    var top = d.top||[];
    var hasImpr = top.some(function(t){ return (t.impressions||0)>0; });
    var topHTML = top.length ? '<div style="overflow-x:auto"><table><thead><tr><th>Post</th><th>Platform</th>'+(hasImpr?'<th>Views</th>':'')+'<th>Interactions</th></tr></thead><tbody>'+
      top.map(function(t){ return '<tr><td style="font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</td><td>'+esc(t.platform)+'</td>'+(hasImpr?'<td style="font-weight:700">'+esc(t.impressionsFmt||t.impressions||0)+'</td>':'')+'<td>'+esc(t.totalEng||0)+'</td></tr>'; }).join('')+
      '</tbody></table></div>' : '';

    var recs = (d.recs||[]).map(function(r,i){
      return '<div class="cr-rec"><div class="cr-rec-num">'+(i+1)+'</div><div><div class="cr-rec-title">'+esc(r.title)+impactBadge(r.impact)+'</div>'+
        (r.detail?'<div class="cr-rec-detail">'+esc(r.detail)+'</div>':'')+
        (r.target?'<div class="cr-rec-target">&#127919; Target: '+esc(r.target)+'</div>':'')+'</div></div>';
    }).join('');

    document.getElementById('report').innerHTML =
      '<div class="cr-hero"><h1>'+esc(d.name||'Report')+'</h1>'+
        '<div class="cr-sub">Social Media Performance'+(d.period?' &middot; '+esc(d.period):'')+'</div>'+
        (d.channels?'<div class="cr-sub" style="margin-top:1px">'+esc(d.channels)+'</div>':'')+
        (heroTiles?'<div class="cr-wins">'+heroTiles+'</div>':'')+
      '</div>'+
      (d.lead?'<div class="cr-section"><div class="cr-h">The Story This Period</div><p class="cr-lead">'+esc(d.lead)+'</p></div>':'')+
      (wins?'<div class="cr-section"><div class="cr-h">Wins Worth Celebrating</div>'+wins+'</div>':'')+
      (topHTML?'<div class="cr-section"><div class="cr-h">Content That Landed</div>'+topHTML+'</div>':'')+
      (recs?'<div class="cr-section"><div class="cr-h">What We Recommend Next</div>'+recs+'</div>':'')+
      feedbackHTML(d)+
      '<div class="foot-note">Posts = feed posts + reels/shorts (Stories excluded). Impressions include video views.</div>'+
      '<div class="foot-brand"><span>Messick Marketing</span> &nbsp;&middot;&nbsp; Prepared for '+esc(d.name||'')+(d.period?' &nbsp;&middot;&nbsp; '+esc(d.period):'')+'</div>';

    wireFeedback(d);
  }

  function feedbackHTML(d){
    return '<div class="cr-section" style="border:none;background:none;padding:0"><div class="mm-fb"><h2>Your turn</h2>'+
      '<p class="mm-fb-sub">What would you like to see more of next quarter?</p>'+
      '<form id="mm-fb-form" novalidate>'+
        '<input type="hidden" name="client_slug" value="'+esc(d.slug||'')+'">'+
        '<input type="hidden" name="client_name" value="'+esc(d.name||'')+'">'+
        '<input type="hidden" name="page" value="">'+
        '<input type="text" name="company_url" class="mm-fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">'+
        '<div class="mm-fb-rating" role="radiogroup" aria-label="Overall rating">'+
          '<label><input type="radio" name="rating" value="More like this"><span>&#128077; More like this</span></label>'+
          '<label><input type="radio" name="rating" value="About right"><span>&#128522; About right</span></label>'+
          '<label><input type="radio" name="rating" value="Less of this"><span>&#128078; Less of this</span></label>'+
        '</div>'+
        '<textarea name="message" rows="4" placeholder="Topics, formats, platforms &mdash; tell us what you\'d love more of&hellip;"></textarea>'+
        '<button type="submit" class="mm-fb-btn">Send Feedback</button>'+
        '<p class="mm-fb-ok" hidden>Thank you &mdash; we&rsquo;ve got your feedback and we&rsquo;ll build it into next quarter. &#127881;</p>'+
        '<p class="mm-fb-err" hidden>That didn&rsquo;t send &mdash; please email us at morgan@messickmarketing.com.</p>'+
      '</form></div></div>';
  }

  function wireFeedback(){
    var form = document.getElementById('mm-fb-form'); if(!form) return;
    var pg = form.querySelector('[name=page]'); if(pg) pg.value = location.href;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(form.company_url && form.company_url.value) return;
      var btn=form.querySelector('.mm-fb-btn'), ok=form.querySelector('.mm-fb-ok'), err=form.querySelector('.mm-fb-err');
      ok.hidden=true; err.hidden=true; btn.disabled=true; btn.textContent='Sending…';
      fetch(FEEDBACK_ENDPOINT,{method:'POST',mode:'no-cors',body:new FormData(form)})
        .then(function(){ form.reset(); ok.hidden=false; btn.textContent='Sent'; })
        .catch(function(){ err.hidden=false; btn.disabled=false; btn.textContent='Send Feedback'; });
    });
  }

  function showMissing(){
    document.getElementById('report').innerHTML = '<div class="load-err"><h2 style="margin-bottom:.5rem">Report not found</h2><p>This link is missing its report, or it has not finished saving yet. Give it a moment and refresh, or ask Messick Marketing to resend it.</p></div>';
  }

  // Fetch a stored report by short id via JSONP (Apps Script sends no CORS headers).
  function fetchReport(id, attempt){
    attempt = attempt || 0;
    var cbName = '__rpt' + Date.now();
    var s = document.createElement('script');
    var done = false;
    var cleanup = function(){ try{document.body.removeChild(s)}catch(e){} try{delete window[cbName]}catch(e){} };
    window[cbName] = function(data){
      done = true; cleanup();
      if(!data || data.error){ if(attempt < 2){ setTimeout(function(){ fetchReport(id, attempt+1); }, 1600); } else showMissing(); return; }
      render(data);
    };
    s.onerror = function(){ if(!done){ cleanup(); if(attempt < 2){ setTimeout(function(){ fetchReport(id, attempt+1); }, 1600); } else showMissing(); } };
    s.src = FEEDBACK_ENDPOINT + '?report=' + encodeURIComponent(id) + '&callback=' + cbName + '&_=' + Date.now();
    document.body.appendChild(s);
    setTimeout(function(){ if(!done){ s.onerror(); } }, 10000);
  }

  var params = new URLSearchParams(location.search);
  var rid = params.get('r');
  if(rid){ fetchReport(rid); }               // short link: ?r=<id>
  else {
    var data = decodePayload();               // legacy self-contained link: #<payload>
    if(data) render(data); else showMissing();
    window.addEventListener('hashchange', function(){ var d=decodePayload(); if(d) render(d); });
  }
</script>
</body>
</html>
